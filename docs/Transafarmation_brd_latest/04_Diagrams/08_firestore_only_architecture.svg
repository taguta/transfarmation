<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 844" width="1120" height="1688" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5560"/></marker></defs><rect width="560" height="844" fill="#FFFFFF"/><text x="280" y="26" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F2933">Firestore-only architecture</text><rect x="20" y="44" width="520" height="76" rx="10" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.5"/><text x="280.0" y="79.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2B5C8A">Flutter app (GetX)</text><text x="280.0" y="95.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Firestore offline cache, commands with client-made IDs, App Check</text><line x1="150" y1="120" x2="150" y2="146" stroke="#4A5560" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="410" y1="120" x2="410" y2="146" stroke="#4A5560" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="20" y="146" width="250" height="66" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="145.0" y="168.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0F6B6B">Firebase Auth</text><text x="145.0" y="184.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Phone sign-in, custom claims: roles,</text><text x="145.0" y="199.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">org, level</text><rect x="290" y="146" width="250" height="66" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="415.0" y="176.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0F6B6B">App Check and rules</text><text x="415.0" y="191.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Only genuine apps; field-level rules</text><line x1="280" y1="212" x2="280" y2="242" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="242" width="330" height="104" rx="10" fill="#E8F1EC" stroke="#1B5E3B" stroke-width="1.5"/><text x="185.0" y="276.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1B5E3B">Cloud Functions (2nd gen)</text><text x="185.0" y="292.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">The only writers of money and shared data:</text><text x="185.0" y="307.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">command processor, settlement waterfall, payout</text><text x="185.0" y="322.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">outbox, report builders, notifications</text><rect x="380" y="242" width="160" height="104" rx="10" fill="#F2F4F5" stroke="#5B6770" stroke-width="1.5"/><text x="460.0" y="283.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">External systems</text><text x="460.0" y="299.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Mobile money, banks,</text><text x="460.0" y="314.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">TIMB, SMS, weather</text><line x1="350" y1="294" x2="380" y2="294" stroke="#4A5560" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="103" y1="346" x2="103" y2="384" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="250" y1="346" x2="275" y2="384" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="330" y1="346" x2="447" y2="384" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="384" width="166" height="168" rx="10" fill="#E8F1EC" stroke="#1B5E3B" stroke-width="1.5"/><text x="103.0" y="450.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1B5E3B">(default) database</text><text x="103.0" y="465.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Users, farms, loads,</text><text x="103.0" y="480.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">read models, report</text><text x="103.0" y="495.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">snapshots</text><rect x="197" y="384" width="166" height="168" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.5"/><text x="280.0" y="435.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">ledger database</text><text x="280.0" y="450.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Ledger, accounts,</text><text x="280.0" y="465.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">escrow, payouts,</text><text x="280.0" y="480.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">consents, audit.</text><text x="280.0" y="495.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Server-only, tight</text><text x="280.0" y="510.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">access</text><rect x="374" y="384" width="166" height="168" rx="10" fill="#FBE9E9" stroke="#8A2B2B" stroke-width="1.5"/><text x="457.0" y="450.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A2B2B">vault database</text><text x="457.0" y="465.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Identity documents and</text><text x="457.0" y="480.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">verification records.</text><text x="457.0" y="495.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Server-only</text><path d="M20 80 H8 V468 H20" fill="none" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="103" y1="552" x2="145" y2="584" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="280" y1="552" x2="415" y2="584" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="584" width="250" height="96" rx="10" fill="#EEE9F7" stroke="#5B4A8A" stroke-width="1.5"/><text x="145.0" y="614.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B4A8A">BigQuery</text><text x="145.0" y="629.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Streamed copy for ad-hoc, historic,</text><text x="145.0" y="644.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">and export queries; scheduled</text><text x="145.0" y="659.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">queries write snapshots back</text><rect x="290" y="584" width="250" height="96" rx="10" fill="#F2F4F5" stroke="#5B6770" stroke-width="1.5"/><text x="415.0" y="621.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">Cloud Storage</text><text x="415.0" y="637.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Photos, contracts, daily ledger</text><text x="415.0" y="652.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">digests with retention lock</text><rect x="20" y="704" width="520" height="120" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="738.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">Guardrails</text><text x="280.0" y="754.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Separate databases give the ledger tighter access. Ledger documents are never</text><text x="280.0" y="769.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">edited; corrections are new entries. Budgets and alerts on reads and writes.</text><text x="280.0" y="784.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Daily export to storage keeps an exit path. Left arrow: the app reads its own</text><text x="280.0" y="799.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">data and writes commands to the default database, under rules.</text></svg>