<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 850" width="1120" height="1700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5560"/></marker></defs><rect width="560" height="850" fill="#FFFFFF"/><text x="280" y="26" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F2933">Sale settlement: the waterfall</text><rect x="100" y="50" width="360" height="64" rx="10" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.5"/><text x="280.0" y="72.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2B5C8A">1. Sale finalised</text><text x="280.0" y="87.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Auction floor or market system records the winning</text><text x="280.0" y="102.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">bid and lot</text><rect x="100" y="132" width="360" height="64" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="280.0" y="154.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0F6B6B">2. Verify</text><text x="280.0" y="169.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Identity and TIMB registry: grower, contract, lot</text><text x="280.0" y="184.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">tags, slot</text><rect x="100" y="214" width="360" height="64" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="280.0" y="243.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0F6B6B">3. Lock grade and price</text><text x="280.0" y="259.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Tamper-evident grade record confirmed by both parties</text><rect x="100" y="296" width="360" height="64" rx="10" fill="#E8F1EC" stroke="#1B5E3B" stroke-width="1.5"/><text x="280.0" y="318.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1B5E3B">4. Run the waterfall</text><text x="280.0" y="333.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Settlement engine splits proceeds in the order set by</text><text x="280.0" y="348.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">law and contract</text><line x1="280" y1="114" x2="280" y2="132" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="280" y1="196" x2="280" y2="214" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="280" y1="278" x2="280" y2="296" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="280" y1="360" x2="280" y2="380" stroke="#4A5560" stroke-width="1.8"/><line x1="78" y1="380" x2="491" y2="380" stroke="#4A5560" stroke-width="1.8"/><rect x="14" y="400" width="128" height="140" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.5"/><text x="78.0" y="421.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">Statutory</text><text x="78.0" y="437.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">levies and</text><text x="78.0" y="453.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">fees</text><text x="78.0" y="468.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">To TIMB and</text><text x="78.0" y="483.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">environmental</text><text x="78.0" y="498.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">funds;</text><text x="78.0" y="513.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">certificate</text><text x="78.0" y="528.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">issued</text><line x1="78" y1="380" x2="78" y2="400" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="78" y1="540" x2="78" y2="556" stroke="#4A5560" stroke-width="1.8"/><rect x="151" y="400" width="128" height="140" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.5"/><text x="215.0" y="444.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">Input loan</text><text x="215.0" y="460.5" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">repayment</text><text x="215.0" y="475.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">To bank or</text><text x="215.0" y="490.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">contractor;</text><text x="215.0" y="505.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">balance updated</text><line x1="215" y1="380" x2="215" y2="400" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="215" y1="540" x2="215" y2="556" stroke="#4A5560" stroke-width="1.8"/><rect x="288" y="400" width="128" height="140" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.5"/><text x="352.0" y="436.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">Freight and</text><text x="352.0" y="452.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">agreed</text><text x="352.0" y="468.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A5A00">deductions</text><text x="352.0" y="483.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Transport escrow</text><text x="352.0" y="498.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">released to the</text><text x="352.0" y="513.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">trucker</text><line x1="352" y1="380" x2="352" y2="400" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="352" y1="540" x2="352" y2="556" stroke="#4A5560" stroke-width="1.8"/><rect x="425" y="400" width="128" height="140" rx="10" fill="#E8F1EC" stroke="#1B5E3B" stroke-width="1.5"/><text x="489.0" y="444.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1B5E3B">Net proceeds</text><text x="489.0" y="460.5" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1B5E3B">to farmer</text><text x="489.0" y="475.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Mobile wallet or</text><text x="489.0" y="490.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">bank, target</text><text x="489.0" y="505.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">within the hour</text><line x1="489" y1="380" x2="489" y2="400" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="489" y1="540" x2="489" y2="556" stroke="#4A5560" stroke-width="1.8"/><line x1="78" y1="556" x2="491" y2="556" stroke="#4A5560" stroke-width="1.8"/><line x1="280" y1="556" x2="280" y2="574" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="100" y="574" width="360" height="64" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="280.0" y="596.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0F6B6B">5. Reconcile and log</text><text x="280.0" y="611.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Ledger entries, audit trail, bank and floor</text><text x="280.0" y="626.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">reconciliation</text><line x1="280" y1="638" x2="280" y2="664" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="100" y="664" width="360" height="64" rx="10" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.5"/><text x="280.0" y="686.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2B5C8A">6. Notify</text><text x="280.0" y="701.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Itemised statement by SMS and app, with a dispute</text><text x="280.0" y="716.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">option</text><rect x="20" y="750" width="520" height="84" rx="10" fill="#F2F4F5" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="774.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">Notes</text><text x="280.0" y="789.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Order of deductions follows law and contract and is configurable. Payout</text><text x="280.0" y="804.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">within the hour is a target that depends on bank and payment rails. Every</text><text x="280.0" y="819.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">step is written to the audit trail.</text></svg>