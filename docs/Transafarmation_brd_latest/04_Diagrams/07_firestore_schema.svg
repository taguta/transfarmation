<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 860" width="1120" height="1720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5560"/></marker></defs><rect width="560" height="860" fill="#FFFFFF"/><text x="280" y="26" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F2933">Firestore collection map (read-model role)</text><rect x="16" y="44" width="262" height="232" rx="12" fill="#E8F1EC" stroke="#1B5E3B" stroke-width="1.5"/><text x="28" y="64" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1B5E3B">Per person</text><rect x="26" y="76" width="242" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="76" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="98" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">users/{id}</text><rect x="26" y="116" width="242" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="116" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="138" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">users/{id}/home/current</text><rect x="26" y="156" width="242" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="156" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="178" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">users/{id}/tasks</text><rect x="26" y="196" width="242" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="196" width="6" height="34" rx="3"