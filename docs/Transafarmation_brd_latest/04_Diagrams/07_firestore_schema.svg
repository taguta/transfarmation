ill="#2B5C8A">Market and movement</text><rect x="26" y="324" width="242" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="324" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="346" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">openLoads/{district}/items</text><rect x="26" y="364" width="242" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="364" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="386" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">loads/{id}</text><rect x="26" y="404" width="242" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="404" width="6" height="34" rx="3" fill="#1B5E3B"/><text x="40" y="426" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">consignments/{id}</text><rect x="292" y="292" width="252" height="192" rx="12" fill="#EEE9F7" stroke="#5B4A8A" stroke-width="1.5"/><text x="304" y="312" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5B4A8A">Reports</text><rect x="302" y="324" width="232" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="302" y="324" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="316" y="346" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">reportSnapshots/{reportId}</text><rect x="16" y="500" width="528" height="150" rx="12" fill="#F2F4F5" stroke="#5B6770" stroke-width="1.5"/><text x="28" y="520" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5B6770">Access and organisations</text><rect x="26" y="532" width="508" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="532" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="554" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">orgs/{id} and orgs/{id}/members</text><rect x="26" y="572" width="508" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="572" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="594" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">accessGrants/{grantee}_{grantor}_{scope}</text><rect x="26" y="612" width="508" height="34" rx="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/><rect x="26" y="612" width="6" height="34" rx="3" fill="#2B5C8A"/><text x="40" y="634" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">notifications/{id}/items (TTL)</text><rect x="16" y="666" width="528" height="176" rx="12" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="6 4"/><text x="28" y="688" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5B6770">How to read this map</text><rect x="28" y="702" width="6" height="22" rx="3" fill="#1B5E3B"/><text x="42" y="719" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Client can write (rules restrict fields; server confirms)</text><rect x="28" y="734" width="6" height="22" rx="3" fill="#2B5C8A"/><text x="42" y="751" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Server writes only; clients read</text><text x="28" y="782" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Money, identity, consent, and audit records live in Postgres, not here.</text><text x="28" y="802" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Screens read one prepared document or a small limited query.</text><text x="28" y="822" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Reports are precomputed snapshots, not scans of source documents.</text></svg>