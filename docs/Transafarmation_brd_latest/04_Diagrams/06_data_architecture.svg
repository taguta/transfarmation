<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" width="1120" height="1800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5560"/></marker></defs><rect width="560" height="900" fill="#FFFFFF"/><text x="280" y="26" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F2933">Recommended data architecture</text><rect x="20" y="44" width="520" height="84" rx="10" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.5"/><text x="280.0" y="76.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2B5C8A">Phones and web (Flutter)</text><text x="280.0" y="91.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Local database with an outbox; reads never wait for the network; commands</text><text x="280.0" y="106.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">carry idempotency keys</text><line x1="280" y1="128" x2="280" y2="152" stroke="#4A5560" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="20" y="152" width="520" height="62" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="280.0" y="173.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0F6B6B">Sync and real-time layer</text><text x="280.0" y="188.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Sync streams to the phone (PowerSync), or Firestore read models if you keep</text><text x="280.0" y="203.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">them</text><line x1="280" y1="214" x2="280" y2="238" stroke="#4A5560" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="20" y="238" width="520" height="70" rx="10" fill="#E8F1EC" stroke="#1B5E3B" stroke-width="1.5"/><text x="280.0" y="263.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1B5E3B">API and functions</text><text x="280.0" y="278.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Validate role, consent, and rules; safe repeat of writes; write to Postgres;</text><text x="280.0" y="293.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">publish events</text><line x1="280" y1="308" x2="280" y2="332" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="332" width="520" height="234" rx="14" fill="#FFF3D6" stroke="#8A5A00" stroke-width="2"/><text x="280" y="356" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A5A00">PostgreSQL: system of record</text><rect x="32" y="372" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="112.0" y="409.5" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Identity and consent</text><rect x="202" y="372" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="282.0" y="402.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Ledger and escrow</text><text x="282.0" y="417.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">(double-entry)</text><rect x="372" y="372" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="452.0" y="402.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Contracts, loads,</text><text x="452.0" y="417.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">lots, bales</text><rect x="32" y="448" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="112.0" y="478.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Audit log (append-</text><text x="112.0" y="493.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">only)</text><rect x="202" y="448" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="282.0" y="478.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Time series</text><text x="282.0" y="493.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">(partitioned)</text><rect x="372" y="448" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="452.0" y="478.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Row-level security on</text><text x="452.0" y="493.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">every table</text><text x="280" y="542" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#1F2933">Portable: managed provider or self-hosted in country</text><line x1="150" y1="566" x2="150" y2="596" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="410" y1="566" x2="410" y2="596" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="596" width="250" height="70" rx="10" fill="#EEE9F7" stroke="#5B4A8A" stroke-width="1.5"/><text x="145.0" y="621.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5B4A8A">Rollup jobs</text><text x="145.0" y="636.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Scheduled: districts, portfolios,</text><text x="145.0" y="651.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">levies, prices</text><rect x="290" y="596" width="250" height="70" rx="10" fill="#F2F4F5" stroke="#5B6770" stroke-width="1.5"/><text x="415.0" y="628.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5B6770">Object storage</text><text x="415.0" y="644.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Photos and contracts, signed links</text><line x1="145" y1="666" x2="145" y2="692" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="692" width="250" height="84" rx="10" fill="#EEE9F7" stroke="#5B4A8A" stroke-width="1.5"/><text x="145.0" y="724.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5B4A8A">Report tables or snapshots</text><text x="145.0" y="739.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">A few rows or documents per</text><text x="145.0" y="754.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">dashboard</text><line x1="145" y1="776" x2="145" y2="800" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="800" width="250" height="70" rx="10" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.5"/><text x="145.0" y="832.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2B5C8A">Dashboards</text><text x="145.0" y="848.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Regulator, bank, government, floor</text><rect x="290" y="692" width="250" height="178" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="6 4"/><text x="415.0" y="755.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">Why this keeps cost predictable</text><text x="415.0" y="771.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Money and reports sit in one place.</text><text x="415.0" y="786.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Report cost does not grow with the</text><text x="415.0" y="801.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">number of farmers. Phones read local</text><text x="415.0" y="816.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">data, so network use is small.</text></svg>