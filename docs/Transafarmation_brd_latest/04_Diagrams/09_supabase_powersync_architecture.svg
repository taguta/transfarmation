<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" width="1120" height="1800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5560"/></marker></defs><rect width="560" height="900" fill="#FFFFFF"/><text x="280" y="26" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F2933">Supabase and PowerSync architecture</text><rect x="20" y="44" width="520" height="84" rx="10" fill="#E6EEF6" stroke="#2B5C8A" stroke-width="1.5"/><text x="280.0" y="76.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2B5C8A">Flutter app (GetX)</text><text x="280.0" y="91.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">PowerSync SDK: encrypted local SQLite database, reads and writes are local,</text><text x="280.0" y="106.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">upload queue sends changes when online</text><line x1="150" y1="128" x2="150" y2="158" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><text x="150" y="148" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#1F2933"></text><line x1="410" y1="128" x2="410" y2="158" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><text x="96" y="148" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#1F2933">sync down</text><text x="462" y="148" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#1F2933">upload</text><rect x="20" y="158" width="250" height="96" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="145.0" y="188.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0F6B6B">PowerSync service</text><text x="145.0" y="203.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Sync rules build per-user data sets</text><text x="145.0" y="218.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">and stream changes to phones. Cloud</text><text x="145.0" y="233.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">or self-hosted</text><rect x="290" y="158" width="250" height="96" rx="10" fill="#E8F1EC" stroke="#1B5E3B" stroke-width="1.5"/><text x="415.0" y="188.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1B5E3B">Supabase API and Edge Functions</text><text x="415.0" y="203.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Upload endpoint: check identity,</text><text x="415.0" y="218.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">validate commands, call SQL</text><text x="415.0" y="233.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">functions, sign photo links</text><line x1="150" y1="322" x2="150" y2="254" stroke="#4A5560" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="60" y="292" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#1F2933">logical replication</text><line x1="410" y1="254" x2="410" y2="322" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="322" width="520" height="236" rx="14" fill="#FFF3D6" stroke="#8A5A00" stroke-width="2"/><text x="280" y="346" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A5A00">Supabase PostgreSQL: system of record</text><rect x="32" y="362" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="112.0" y="390.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">app schema (synced to</text><text x="112.0" y="405.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">phones)</text><rect x="202" y="362" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="282.0" y="390.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">ledger (private,</text><text x="282.0" y="405.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">double-entry)</text><rect x="372" y="362" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="452.0" y="390.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">vault (private</text><text x="452.0" y="405.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">identity records)</text><rect x="32" y="434" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="112.0" y="462.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">audit (append-only,</text><text x="112.0" y="477.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">hash-chained)</text><rect x="202" y="434" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="282.0" y="462.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">reports (rollup</text><text x="282.0" y="477.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">tables)</text><rect x="372" y="434" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5"/><text x="452.0" y="462.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">sensors (partitioned,</text><text x="452.0" y="477.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">not synced)</text><text x="280" y="528" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#1F2933">Row-level security on every table</text><line x1="103" y1="558" x2="103" y2="588" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="280" y1="558" x2="280" y2="588" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><line x1="457" y1="558" x2="457" y2="588" stroke="#4A5560" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="588" width="166" height="96" rx="10" fill="#E0F2F1" stroke="#0F6B6B" stroke-width="1.5"/><text x="103.0" y="625.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0F6B6B">Supabase Auth</text><text x="103.0" y="641.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Phone sign-in, token</text><text x="103.0" y="656.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">with person and roles</text><rect x="197" y="588" width="166" height="96" rx="10" fill="#F2F4F5" stroke="#5B6770" stroke-width="1.5"/><text x="280.0" y="625.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">Storage</text><text x="280.0" y="641.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Photos and contracts,</text><text x="280.0" y="656.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">signed links</text><rect x="374" y="588" width="166" height="96" rx="10" fill="#EEE9F7" stroke="#5B4A8A" stroke-width="1.5"/><text x="457.0" y="617.75" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B4A8A">Jobs (pg_cron,</text><text x="457.0" y="634.0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B4A8A">workers)</text><text x="457.0" y="649.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Rollups, payouts,</text><text x="457.0" y="664.25" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">reconciliation</text><rect x="20" y="704" width="250" height="72" rx="10" fill="#EEE9F7" stroke="#5B4A8A" stroke-width="1.5"/><text x="145.0" y="729.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B4A8A">Read replica</text><text x="145.0" y="745.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Reports and exports off the main</text><text x="145.0" y="760.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">database</text><rect x="290" y="704" width="250" height="72" rx="10" fill="#F2F4F5" stroke="#5B6770" stroke-width="1.5"/><text x="415.0" y="737.375" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">External systems</text><text x="415.0" y="752.625" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Mobile money, banks, TIMB, SMS</text><rect x="20" y="796" width="520" height="84" rx="10" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="827.875" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B6770">Guardrails</text><text x="280.0" y="843.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">Raw sensor data stays out of the synced publication. Money changes only</text><text x="280.0" y="858.125" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933">through SQL functions. Photos are uploaded to storage, not through sync.</text></svg>